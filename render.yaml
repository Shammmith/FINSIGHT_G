services:
  - type: web
    name: finsight-core-api
    env: docker
    dockerContext: ./core_api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_ENGINE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  - type: web
    name: finsight-ml-engine
    env: docker
    dockerContext: ./ml_engine
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false